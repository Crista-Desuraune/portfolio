services:
  astro:
    container_name: astro
    restart: unless-stopped
    build:  .
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - "traefik.http.routers.astro.rule=Host(`crista-desuraune.fr`) || Host(`crista-desuraune.fr`)"
      - "traefik.http.routers.astro.entrypoints=websecure"
      - "traefik.http.routers.owguesser.tls.certresolver=letsencrypt"
      - "traefik.http.services.owguesser.loadbalancer.server.port=80"

  traefik:
      image: traefik:v3.6
      command:
        - "--api.insecure=true"
        - "--providers.docker=true"
        - "--entrypoints.web.address=:80"
      ports:
        - "80:80"
        - "8080:8080"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        
networks:
  traefik:
    external: true
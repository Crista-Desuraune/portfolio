services:

  astro:
    container_name: astro
    build: .
    restart: unless-stopped
    ports:
      - "4321:4321"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astro.rule=Host(`crista-desuraune.fr`)"
      - "traefik.http.routers.astro.entrypoints=websecure"
      - "traefik.http.services.astro.loadbalancer.server.port=4321"

networks:
  web:
    external: false